<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scoreboard">
        <div class="team">
            <span class="team-name" id="player1-name">You (Red)</span>
            <span class="team-score" id="score1">0</span>
        </div>
        <div class="team">
            <span class="team-name" id="player2-name">AI (Blue)</span>
            <span class="team-score" id="score2">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="instructions">
        Use <strong>Arrow Keys</strong> or <strong>W,A,S,D</strong> to move. Push the ball into the right goal!
    </div>
    <script src="script.js"></script>
</body>
</html>
